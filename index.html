<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نيفيو شات الذكية | Nevio Chat Quantum UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-light: #FFD700;
            --cyan: #00F2FF; 
            --bg-dark: #02050a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }
        
        body, html { 
            height: 100%; 
            background-color: var(--bg-dark);
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden;
        }

        /* خلفية جزيئات متحركة (Simulation) */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a101f 0%, #02050a 100%);
            z-index: -1;
        }

        .bg-animate::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--glass-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            mask-image: radial-gradient(circle, black, transparent 80%);
        }

        /* الحاوية الرئيسية */
        .quantum-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* الكارت الزجاجي الاحترافي */
        .glass-card {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            backdrop-filter: blur(25px);
            max-width: 550px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(212, 175, 55, 0.05);
            animation: cardEntrance 1.2s ease-out forwards;
            transform-style: preserve-3d;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(50px) rotateX(-10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        /* الشعار والتأثيرات الضوئية */
        .logo-glow {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 255, 0.05);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            color: var(--cyan);
            font-size: 0.75rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .status-pulse {
            width: 6px; height: 6px; background: var(--cyan); border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        h2 { font-size: 1.5rem; margin-bottom: 20px; font-weight: 700; color: #f0f0f0; }
        p { color: #8892b0; line-height: 1.8; margin-bottom: 40px; font-size: 1rem; }

        /* زر الانتقال المتقدم */
        .neon-btn {
            position: relative;
            padding: 20px 50px;
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            text-decoration: none;
            border-radius: 15px;
            overflow: hidden;
            display: inline-block;
            transition: 0.4s;
            cursor: pointer;
            z-index: 1;
        }

        .neon-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .neon-btn:hover::before { left: 100%; }
        .neon-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
            transform: scale(1.05);
        }

        /* الفوتر التقني */
        .footer-info {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
        }

        .brand-footer { color: var(--gold); font-weight: bold; }

        /* تأثير المسح الضوئي */
        .scanline {
            width: 100%; height: 100px; z-index: 10;
            background: linear-gradient(0deg, rgba(0, 242, 255, 0.05) 0%, transparent 100%);
            position: absolute; bottom: 100%; animation: scan 4s linear infinite;
        }

        @keyframes scan { from { bottom: 100%; } to { bottom: -100px; } }

    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div class="quantum-container">
        <div class="glass-card">
            <div class="scanline"></div>
            
            <div class="logo-glow">NEVIO</div>
            
            <div class="system-status">
                <div class="status-pulse"></div>
                <span>Nevio Cloud Core: Connected</span>
            </div>

            <h2>لوحة إدارة الأتمتة السحابية</h2>
            <p>أهلاً بك يا <b>سلمان</b>. النظام جاهز لبدء عمليات الأتمتة وإدارة المحادثات المباشرة لعملاء نيفيوشات.</p>

            <a href="https://botsailor.com/all/livechat" target="_blank" class="neon-btn">
                دخول النظام المباشر 🛡️
            </a>

            <div style="margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                <span style="color: #444; font-size: 0.7rem;">IP: Encrypted | Protocol: Secure | Access: Admin</span>
            </div>
        </div>
    </div>

    <div class="footer-info">
        DEVELOPED BY <span class="brand-footer">SALMAN ALGHUWAIBI</span> | POWERED BY NEVIO TECH 2026
    </div>

</body>
</html>
