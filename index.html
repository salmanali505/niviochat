<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم نظام نيفيوشات | Nevio Chat Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-glow: rgba(212, 175, 55, 0.5);
            --cyan: #00F2FF; 
            --bg-dark: #02050a;
            --glass: rgba(15, 20, 35, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الإطار الاحترافي المضيء */
        .main-frame {
            position: relative;
            background: var(--glass);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.1);
            animation: fadeIn 1.5s ease-in-out;
        }

        /* لمسة احترافية: زوايا مضيئة */
        .main-frame::before, .main-frame::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid var(--gold);
            border-radius: 15px;
        }
        .main-frame::before { top: -10px; right: -10px; border-bottom: none; border-left: none; }
        .main-frame::after { bottom: -10px; left: -10px; border-top: none; border-right: none; }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 1.2rem;
            color: var(--cyan);
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 700;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
            display: inline-block;
            padding-bottom: 5px;
        }

        .welcome-msg {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* الزر الاحترافي */
        .nevio-btn {
            position: relative;
            padding: 18px 50px;
            background: linear-gradient(135deg, var(--gold), #b38f2d);
            color: #000;
            font-size: 1.2rem;
            font-weight: 900;
            text-decoration: none;
            border-radius: 100px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
        }

        .nevio-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #FFD700, var(--gold));
        }

        .nevio-btn::after {
            content: " 💬";
            font-size: 1.2rem;
        }

        /* الفوتر الاحترافي */
        .footer-text {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }

        .rights {
            color: var(--gold);
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* تأثير النبض للخلفية */
        .pulse-orb {
            position: absolute;
            width: 200px; height: 200px;
            background: var(--gold);
            filter: blur(100px);
            opacity: 0.1;
            z-index: -1;
            animation: moveOrb 10s infinite alternate;
        }

        @keyframes moveOrb {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }
    </style>
</head>
<body>

    <div class="pulse-orb"></div>

    <div class="main-frame">
        <h1 class="brand-title">شركة نيفيوشات</h1>
        <div class="sub-title">لوحة تحكم النظام</div>
        
        <p class="welcome-msg">
            أهلاً بكم.. <br> 
            الرجاء للدخول إلى لوحة التحكم الخاصة بكم الضغط على الزر أدناه
        </p>

        <a href="https://botsailor.com/all/livechat" target="_blank" class="nevio-btn">
            دخول النظام الآمن
        </a>

        <div class="footer-text">
            جميع الحقوق محفوظة لدى <span class="rights">شركة نيفيوشات © 2026</span>
            <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 10px;">بواسطة المطور سلمان علي الغويبي</div>
        </div>
    </div>

</body>
</html>
